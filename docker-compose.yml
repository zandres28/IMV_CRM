version: '3.8'

services:
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ***REMOVED***
      MYSQL_DATABASE: imv_crm
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306" # Mapped to 3307 to avoid conflict with local Laragon MySQL (3306)

  backend:
    build: ./backend
    restart: always
    ports:
      - "3010:3010"
    environment:
      - PORT=3010
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=***REMOVED***
      - DB_NAME=imv_crm
      - JWT_SECRET=***REMOVED***
      - N8N_API_KEY=***REMOVED***
    volumes:
      - ./tmp:/app/tmp
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      args:
        # Aquí definimos la URL pública de la API para el build de React
        # Como usas DuckDNS + NPM, más adelante cambiarás esto por tu dominio (ej. https://api.tu-dominio.duckdns.org)
        # Por ahora, usamos la IP pública y el puerto que abrimos (3010)
        REACT_APP_API_URL: http://149.130.162.188:3010/api
    restart: always
    ports:
      - "8095:80"
    volumes:
      # Mount a host .htpasswd into the nginx container to enable basic auth
      # On the VPS create the file at ./deploy/nginx/.htpasswd and it will be mounted here
      - ./deploy/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - backend

volumes:
  db_data:
