version: '3.8'

services:
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ***REMOVED***
      MYSQL_DATABASE: imv_crm
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3307:3306" # Mapped to localhost only for security

  backend:
    build: ./backend
    restart: always
    ports:
      - "3010:3010"
    environment:
      - PORT=3010
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=***REMOVED***
      - DB_NAME=imv_crm
      - JWT_SECRET=***REMOVED***
      - N8N_API_KEY=***REMOVED***
    volumes:
      - ./tmp:/app/tmp
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL}
    restart: always
    ports:
      - "8095:80" 
    depends_on:
      - backend

volumes:
  db_data:
