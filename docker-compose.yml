version: '3.8'

services:
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ***REMOVED***
      MYSQL_DATABASE: imv_crm
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306" # Mapped to 3307 to avoid conflict with local Laragon MySQL (3306)

  backend:
    build: ./backend
    restart: always
    ports:
      - "3010:3010"
    environment:
      - PORT=3010
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=***REMOVED***
      - DB_NAME=imv_crm
      - JWT_SECRET=***REMOVED***
      - N8N_API_KEY=***REMOVED***
    depends_on:
      - db

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
